app = "sports-betting-ai-agent"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  SBA_AUTO_TRADE = "1"
  SBA_AUTO_TRADE_INTERVAL = "300"
  SBA_LANG = "vi"
  SBA_DATA_DIR = "/data/sba"
  SBA_ENABLED_SOURCES = "bovada,draftkings,espn,scoresandodds,vegasinsider,actionnetwork,sbr"
  # ActionNetwork returns a 500KB+ payload; 12s was cutting it off on
  # Fly's network and we lost every non-Bovada spread/total line. 25s
  # is comfortably long but still under the aggregator's 20s-per-sport
  # wait window so slow sources stay bounded without hanging the loop.
  SBA_HTTP_TIMEOUT = "25"

[[mounts]]
  source = "sba_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
